<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Server Admin: Max Edition</title>
<style>
:root{--bg:#0b0f15;--panel:#121822;--card:#161d2a;--border:#2a3445;--text:#c9d1d9;--muted:#8b9bb4;--green:#3ddc84;--yellow:#fbb829;--red:#f07178;--blue:#53cef5;--purple:#b388ff;--orange:#ff8a65;}
*{box-sizing:border-box;}
body{margin:0;padding:10px;background:var(--bg);color:var(--text);font-family:'Segoe UI',Roboto,sans-serif;font-size:13px;}
.dashboard{max-width:1500px;margin:0 auto;}
.topbar{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:12px;flex-wrap:wrap;}
.topbar h1{margin:0;color:#fff;font-weight:600;font-size:18px;}
.balance{color:var(--green);font-weight:bold;font-size:15px;}
.level-badge{background:var(--purple);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;color:#fff;}
.xp-wrap{flex:1;min-width:150px;max-width:300px;}
.xp-bar{height:6px;background:#252e40;border-radius:3px;overflow:hidden;}
.xp-fill{height:100%;background:var(--purple);width:0%;transition:width .4s;}
.btn{background:#2a3445;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:12px;}
.btn:hover{background:#34415a;}
.btn.danger{border-color:var(--red);color:var(--red);}
.grid-main{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;align-items:start;}
@media(max-width:1000px){.grid-main{grid-template-columns:1fr;}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:12px;}
.panel h3{margin:0 0 8px 0;color:#fff;font-size:14px;}
.sys-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;cursor:pointer;}
.sys-card.selected{border-color:var(--blue);box-shadow:0 0 8px rgba(83,206,245,.3);}
.sys-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap;}
.sys-name{font-weight:600;color:#fff;font-size:14px;}
.specs{color:var(--muted);font-size:11px;line-height:1.5;}
.meter-row{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;}
.meter{flex:1;min-width:100px;}
.meter-label{font-size:11px;color:var(--muted);margin-bottom:3px;display:flex;justify-content:space-between;}
.bar-bg{width:100%;height:6px;background:#252e40;border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;width:0%;transition:width .6s ease,background .3s;}
.rack{perspective:600px;margin:10px auto;width:170px;height:170px;position:relative;}
.rack-inner{position:absolute;inset:0;transform:rotateX(18deg) rotateY(-14deg);transform-style:preserve-3d;transition:transform .3s;}
.rack:hover .rack-inner{transform:rotateX(10deg) rotateY(0deg);}
.unit{position:absolute;left:0;width:100%;height:30px;background:#1a2230;border:1px solid #334257;border-radius:3px;box-shadow:inset 0 0 6px rgba(0,0,0,.5);}
.u1{top:0;}.u2{top:34px;}.u3{top:68px;}.u4{top:102px;}.u5{top:136px;}
.led{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);transition:background .5s,box-shadow .5s;}
.fan{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;border:2px solid #556;border-radius:50%;animation:spin 1.5s linear infinite;}
@keyframes spin{from{transform:translateY(-50%) rotate(0deg);}to{transform:translateY(-50%) rotate(360deg);}}
.drive{position:absolute;left:36px;right:40px;top:50%;transform:translateY(-50%);height:4px;background:#0d1320;border-radius:2px;overflow:hidden;}
.drive-bit{position:absolute;top:0;width:14px;height:100%;background:var(--blue);opacity:.8;animation:blink 1.2s infinite;}
@keyframes blink{0%,100%{opacity:.15;}50%{opacity:.85;}}
.console{background:#0a0e14;border:1px solid var(--border);border-radius:6px;padding:10px;height:170px;overflow-y:auto;font-family:Consolas,monospace;font-size:12px;color:var(--green);}
.console .p{color:var(--blue);}
.console .err{color:var(--red);}
.console .warn{color:var(--yellow);}
.console .info{color:var(--muted);}
.console-input{width:100%;margin-top:6px;background:#0a0e14;border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:Consolas,monospace;padding:6px 8px;outline:none;}
.shop-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.shop-tab{padding:5px 10px;border-radius:6px;background:#1a2230;border:1px solid var(--border);cursor:pointer;font-size:12px;}
.shop-tab.active{background:var(--blue);color:#06121a;border-color:var(--blue);font-weight:600;}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.item-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:4px;}
.item-card.owned{border-color:var(--green);}
.item-card.locked{opacity:.45;}
.item-name{font-weight:600;font-size:12px;color:#fff;}
.item-price{color:var(--yellow);font-size:12px;}
.item-old{color:var(--muted);text-decoration:line-through;font-size:11px;margin-right:5px;}
.item-desc{color:var(--muted);font-size:10px;line-height:1.3;flex:1;}
.task-list{display:flex;flex-direction:column;gap:8px;}
.task-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px 10px;}
.task-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.task-name{font-weight:600;color:#fff;}
.task-meta{color:var(--yellow);font-size:11px;}
.task-rec{color:var(--blue);font-size:11px;margin-top:4px;}
.task-req-bad{color:var(--red);font-size:11px;margin-top:3px;}
.task-prog{margin-top:6px;}
.active-task{background:#1a2230;border:1px solid var(--border);border-radius:6px;padding:6px 8px;margin-bottom:6px;}
.upg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;}
.promo-row{display:flex;gap:8px;margin-top:8px;}
.promo-row input{flex:1;background:#0a0e14;border:1px solid var(--border);border-radius:4px;color:var(--text);padding:6px 8px;outline:none;font-family:Consolas,monospace;}
.flash{animation:flash .8s;}
@keyframes flash{0%{background:#3ddc8433;}100%{background:transparent;}}
.warn-line{color:var(--yellow);font-size:11px;margin-top:4px;}
.status-ok{color:var(--green);}.status-warn{color:var(--yellow);}.status-err{color:var(--red);}
</style>

    <h1>&#128421; Server Admin</h1>
    <div>Баланс: <span class="balance" id="balance"></span></div>
    <div class="level-badge" id="levelBadge"></div>
    <div class="xp-wrap"><div style="font-size:11px;color:var(--muted);margin-bottom:3px;"><span id="xpText"></span></div><div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div></div>
    <div id="discountInfo" style="font-size:11px;color:var(--orange);"></div>
    <button class="btn" id="addSysBtn">+ Система (5 000 &#8381;)</button>
    <button class="btn danger" id="resetBtn">Сбросить прогресс</button>
  </div>

  <div class="grid-main">
    <div id="systemsCol"></div>
    <div id="rightCol">
      <div class="panel">
        <h3>&#128187; Консоль</h3>
        <div class="console" id="consoleOut"></div>
        <input class="console-input" id="consoleIn" placeholder="Введите команду (help)">
      </div>

      <div class="panel">
        <h3>&#128640; Задачи</h3>

        <div class="task-list" id="taskOptions"></div>
      </div>

      <div class="panel">
        <h3>&#11014; Апгрейды</h3>
        <div class="upg-grid" id="upgGrid"></div>
      </div>

      <div class="panel">
        <h3>&#128722; Магазин <span id="shopTarget" style="color:var(--muted);font-size:11px;"></span></h3>
        <div class="shop-tabs" id="shopTabs"></div>
        <div class="shop-grid" id="shopGrid"></div>
        <div class="promo-row">

        </div>

        <div id="promoOut" style="margin-top:6px;font-size:12px;"></div>
      </div>
    </div>
  </div>
</div>

// ================= СОСТОЯНИЕ =================
let S=null;
function freshState(){
 return {balance:10000,xp:0,level:1,upgrades:{},promosUsed:[],discount:null,systems:[mkSystem('SRV-01')],selected:0};
}
function mkSystem(name){
 return {name,cpu:0,gpu:-1,ram:0,psu:0,nic:0,ssd:0,cool:0,av:0,
   load:0,targetLoad:0,temp:32.0,phase:Math.random()*6.28,
   overheatTicks:0,infected:0,on:true,active:[]};
}
function saveState(){try{const c=JSON.parse(JSON.stringify(S));c.systems.forEach(s=>{delete s.el;});localStorage.setItem('srv_admin_max',JSON.stringify(c));}catch(e){}}
function loadState(){
 try{const raw=localStorage.getItem('srv_admin_max');if(!raw)return false;
  const d=JSON.parse(raw);if(!d||!d.systems||!d.systems.length)return false;
  S=d;S.systems.forEach(s=>{s.el=null;s.phase=Math.random()*6.28;});
  if(S.selected>=S.systems.length)S.selected=0;return true;
 }catch(e){return false;}
}
function xpNeed(l){return 150*l;}
function fmt(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'\u2009')+' \u20BD';}
function up(id){return S.upgrades[id]||0;}
function effCpuP(s){return SHOP.cpu[s.cpu].p*(1+0.10*up('occ'));}
function effGpuP(s){return s.gpu<0?0:SHOP.gpu[s.gpu].p*(1+0.10*up('ocg'));}
function coolFactor(s){return SHOP.cooling[s.cool].f*(1-0.04*up('fans'))*(1-0.03*up('liqmetal'));}
function overheatLimit(s){return 95+2*up('aitemp');}
function drawWatts(s){
 const base=90+effCpuP(s)*38+effGpuP(s)*62+SHOP.ram[s.ram].gb*0.35+SHOP.ssd[s.ssd].tb*2+SHOP.nic[s.nic].sp*1.5;
 return base*(0.55+ (s.load/100)*0.9)*(1-0.05*up('pwr'));
}

// ================= КОНСОЛЬ =================
const conOut=document.getElementById('consoleOut');
function clog(html,cls){const d=document.createElement('div');if(cls)d.className=cls;d.innerHTML=html;conOut.appendChild(d);conOut.scrollTop=conOut.scrollHeight;while(conOut.children.length>200)conOut.removeChild(conOut.firstChild);}
function handleCmd(raw){
 const parts=raw.trim().split(/\s+/);const cmd=(parts[0]||'').toLowerCase();const arg=parts.slice(1).join(' ');
 clog('<span class="p">admin@srv:~$</span> '+raw.replace(/</g,'&lt;'));
 if(!cmd)return;
 if(cmd==='help'){
  clog('Команды: status, tasks, list, buy &lt;категория&gt; &lt;номер&gt;, add, remove, boot, scan, promo &lt;КОД&gt;, promolist, upgrades, reset');
 }else if(cmd==='status'){
  const s=cur();clog('Система: '+s.name+' | уровень '+S.level+' | баланс '+fmt(S.balance));
  clog('Нагрузка '+Math.round(s.load)+'% | Температура '+s.temp.toFixed(1)+'\u00B0C | Питание '+Math.round(drawWatts(s))+'/'+SHOP.psu[s.psu].w+' Вт', s.temp>overheatLimit(s)?'warn':'');
 }else if(cmd==='tasks'){
  clog('Задачи: '+TASKS.map(t=>t.n).join(', '));
 }else if(cmd==='list'){
  CATS.forEach(c=>clog(c[1]+': '+SHOP[c[0]].map((it,i)=>(i+1)+'. '+it.n+' — '+fmt(it.c)).join(' | ')));
 }else if(cmd==='buy'){
  buyByConsole(arg);
 }else if(cmd==='add'){
  addSystem();
 }else if(cmd==='remove'){
  removeSystem();
 }else if(cmd==='boot'){
  const s=S.systems.find(x=>x.name.toLowerCase()===arg.toLowerCase())||cur();
  s.on=true;s.overheatTicks=0;s.temp=32;clog('Система '+s.name+' запущена.','info');
 }else if(cmd==='scan'){
  const s=cur();if(s.infected>0){s.infected=0;clog('Вирус обезврежен на '+s.name+'.','info');}else clog('Угроз не обнаружено.','info');
 }else if(cmd==='promo'){
  applyPromo(arg.toUpperCase());
 }else if(cmd==='promolist'){
  clog(Object.keys(PROMOS).map(k=>k+' ('+PROMOS[k].d+')'+(S.promosUsed.includes(k)?' [использован]':'')).join(' | '));
 }else if(cmd==='upgrades'){
  clog(UPGRADES.map(u=>u.n+' ур.'+up(u.id)+'/'+u.max).join(' | '));
 }else if(cmd==='reset'){
  if(confirm('Сбросить весь прогресс?')){localStorage.removeItem('srv_admin_max');location.reload();}
 }else{clog('Неизвестная команда. help — список.','err');}
}
function buyByConsole(arg){
 const parts=arg.split(/\s+/);if(parts.length<2){clog('Формат: buy &lt;категория&gt; &lt;номер&gt;','err');return;}
 const cat=parts[0].toLowerCase();const num=parseInt(parts[1],10);
 if(!SHOP[cat]){clog('Нет такой категории: '+cat,'err');return;}
 buyItem(cat,num-1);
}
document.getElementById('consoleIn').addEventListener('keydown',e=>{
 if(e.key==='Enter'){handleCmd(e.target.value);e.target.value='';}});

let shopCat='cpu';
function renderShopTabs(){
 const el=document.getElementById('shopTabs');el.innerHTML='';
 CATS.forEach(c=>{const b=document.createElement('div');b.className='shop-tab'+(shopCat===c[0]?' active':'');b.textContent=c[1];
  b.onclick=()=>{shopCat=c[0];renderShopTabs();renderShop();};el.appendChild(b);});
}
function cur(){return S.systems[S.selected];}
function discountPrice(cost){
 if(S.discount&&S.discount.v>=100)return 0;
 return Math.round(cost*(1-(S.discount?S.discount.v:0)/100));
}
function buyItem(cat,idx){
 const list=SHOP[cat];if(!list||idx<0||idx>=list.length)return;
 const it=list[idx];const s=cur();
 if(it.l>S.level){clog(it.n+' доступен с уровня '+it.l,'err');return;}
 const price=discountPrice(it.c);
 if(S.balance<price){clog('Не хватает денег: нужно '+fmt(price),'err');return;}
 S.balance-=price;
 if(S.discount){S.discount=null;}
 if(cat==='cooling')s.cool=idx;else if(cat==='av')s.av=idx;else s[cat]=idx;
 clog('Куплено: '+it.n+' ('+fmt(price)+') для '+s.name,'info');
 renderAll();saveState();
}
function renderShop(){
 const el=document.getElementById('shopGrid');el.innerHTML='';
 document.getElementById('shopTarget').textContent='— покупка идёт в систему '+cur().name;
 SHOP[shopCat].forEach((it,idx)=>{
  const card=document.createElement('div');
  const owned=(shopCat==='cooling'&&cur().cool===idx)||(shopCat==='av'&&cur().av===idx)||(!['cooling','av'].includes(shopCat)&&cur()[shopCat]===idx);
  card.className='item-card'+(owned?' owned':'')+(it.l>S.level?' locked':'');
  const price=discountPrice(it.c);
  let pr=owned?'<span class="status-ok">установлено</span>':(price===0?'<span class="status-ok">БЕСПЛАТНО</span>':((S.discount&&S.discount.v>0)?'<span class="item-old">'+fmt(it.c)+'</span>':'')+fmt(price));
  card.innerHTML='<span class="item-name">'+it.n+'</span><div class="item-price">'+pr+'</div><div class="item-desc">'+it.d+(it.l>1?'<br><span style="color:var(--purple);">ур. '+it.l+'+</span>':'')+'</div>';
  const b=document.createElement('button');b.className='btn';b.textContent='Купить';
  b.onclick=()=>buyItem(shopCat,idx);
  card.appendChild(b);el.appendChild(card);
 });
}

function applyPromo(code){
 const out=document.getElementById('promoOut');
 if(!code){out.innerHTML='<span class="status-err">Введите код.</span>';return;}
 const p=PROMOS[code];
 if(!p){out.innerHTML='<span class="status-err">Промокод «'+code.replace(/</g,'&lt;')+'» не найден.</span>';return;}
 if(S.promosUsed.includes(code)){out.innerHTML='<span class="status-warn">Уже использован.</span>';return;}
 S.promosUsed.push(code);
 if(p.t==='money'){S.balance+=p.v;out.innerHTML='<span class="status-ok">+ '+fmt(p.v)+'</span>';clog('Промокод '+code+': +'+fmt(p.v),'info');}
 else if(p.t==='xp'){S.xp+=p.v;out.innerHTML='<span class="status-ok">+ '+p.v+' XP</span>';clog('Промокод '+code+': +'+p.v+' XP','info');checkLevel();}
 else if(p.t==='disc'){S.discount={v:p.v};out.innerHTML='<span class="status-ok">Скидка '+p.v+'% заряжена — сработает на следующей покупке.</span>';clog('Промокод '+code+': скидка '+p.v+'%','info');}
 renderAll();saveState();
}
document.getElementById('promoBtn').onclick=()=>{applyPromo(document.getElementById('promoInput').value.trim().toUpperCase());document.getElementById('promoInput').value='';};

};

function checkLevel(){
 while(S.xp>=xpNeed(S.level)){S.xp-=xpNeed(S.level);S.level++;
  clog('&#127881; Новый уровень: '+S.level+'! Открыто новое железо и задачи.','info');}
}
function upCost(u){return Math.round(u.base*Math.pow(1.6,up(u.id)));}
function renderUpgrades(){
 const el=document.getElementById('upgGrid');el.innerHTML='';
 UPGRADES.forEach(u=>{

  b.disabled=maxed||S.balance<upCost(u);
  b.onclick=()=>{if(S.balance<upCost(u))return;S.balance-=upCost(u);S.upgrades[u.id]=up(u.id)+1;clog('Апгрейд: '+u.n+' → ур.'+up(u.id),'info');renderAll();saveState();};
  card.appendChild(b);el.appendChild(card);
 });

// ================= ЗАДАЧИ =================
function reqCheck(task,s){
 const bad=[];
 if(task.req.lvl&&S.level<task.req.lvl)bad.push('нужен уровень '+task.req.lvl+'+');
 if(task.req.gpu&&effGpuP(s)<task.req.gpu)bad.push('нужна видеокарта мощнее (перф '+task.req.gpu+'+)');
 if(task.req.cpu&&effCpuP(s)<task.req.cpu)bad.push('нужен процессор мощнее (перф '+task.req.cpu+'+)');
 if(task.req.ram&&SHOP.ram[s.ram].gb<task.req.ram)bad.push('нужно '+task.req.ram+' ГБ RAM');
 if(task.req.psu&&SHOP.psu[s.psu].w<task.req.psu)bad.push('нужен БП от '+task.req.psu+' Вт');
 if(task.req.nic&&SHOP.nic[s.nic].sp<task.req.nic)bad.push('нужна сеть от '+task.req.nic+' Гбит/с');
 return bad;
}
function renderTasks(){
 const s=cur();
 const av=document.getElementById('activeTasks');av.innerHTML='';
 s.active.forEach(at=>{
  const d=document.createElement('div');d.className='active-task';
  d.innerHTML='<div class="task-top"><span class="task-name">'+at.n+'</span><span class="task-meta">'+Math.round(at.prog*100)+'%</span></div><div class="task-prog"><div class="bar-bg"><div class="bar-fill" style="width:'+(at.prog*100)+'%;background:var(--green);"></div></div></div>';
  av.appendChild(d);
 });
 const box=document.getElementById('taskOptions');box.innerHTML='';
 TASKS.forEach(task=>{
  const bad=reqCheck(task,s);const running=s.active.some(a=>a.id===task.id);
  const card=document.createElement('div');card.className='task-card';
  const reward=Math.round(task.rw*(1+0.08*(S.level-1))*(1+0.08*up('prem')));
  const xpGain=Math.round(task.xp*(1+0.08*up('edu')));
  card.innerHTML='<div class="task-top"><span class="task-name">'+task.n+(running?' <span class="status-warn">[выполняется]</span>':'')+'</span><span class="task-meta">'+fmt(reward)+' + '+xpGain+' XP</span></div>'
   +'<div class="task-rec">Рекомендуется: '+task.rec+'</div>'
   +(bad.length?'<div class="task-req-bad">Не хватает: '+bad.join('; ')+'</div>':'');
  if(!bad.length&&!running){
   const b=document.createElement('button');b.className='btn';b.textContent='Запустить';
   b.onclick=()=>startTask(task);card.appendChild(b);
  }
  box.appendChild(card);
 });
}
function startTask(task){
 const s=cur();const bad=reqCheck(task,s);if(bad.length)return;
 const reward=Math.round(task.rw*(1+0.08*(S.level-1))*(1+0.08*up('prem')));
 const xpGain=Math.round(task.xp*(1+0.08*up('edu')));
 const dur=Math.max(3,Math.round(task.t*(1-0.05*up('sched'))));
 s.active.push({id:task.id,n:task.n,prog:0,load:task.load,dur,reward,xp:xpGain});
 s.targetLoad=Math.min(100,s.active.reduce((a,x)=>a+x.load,0));
 clog('Запущено: '+task.n+' ('+dur+' с)','info');
 renderTasks();saveState();
}

function addSystem(){
 if(S.balance<5000){clog('Новая система стоит 5 000 \u20BD','err');return;}
 S.balance-=5000;const n='SRV-0'+(S.systems.length+1);
 S.systems.push(mkSystem(n));S.selected=S.systems.length-1;
 clog('Добавлена система '+n,'info');renderAll();saveState();
}
function removeSystem(){
 if(S.systems.length<=1){clog('Нельзя удалить последнюю систему','err');return;}
 if(!confirm('Удалить систему '+cur().name+'?'))return;
 S.systems.splice(S.selected,1);S.selected=0;renderAll();saveState();
}

function ledColor(s){
 if(s.infected)return'var(--purple)';
 const t=s.temp;
 if(!s.on)return'#444c5c';
 if(t>=overheatLimit(s))return'var(--red)';
 if(t>=85)return'var(--orange)';
 if(t>=70)return'var(--yellow)';
 return'var(--green)';
}
function updateSystemUI(s){
 if(!s.el)return;
 const l=Math.round(s.load);
 s.el.loadTxt.textContent=l+'%';
 s.el.loadBar.style.width=l+'%';
 s.el.loadBar.style.background=l>85?'var(--red)':l>60?'var(--yellow)':'var(--green)';
 const t=s.temp;
 s.el.tempTxt.textContent=t.toFixed(1)+'\u00B0C';
 s.el.tempBar.style.width=Math.min(100,t/105*100)+'%';
 s.el.tempBar.style.background=t>=overheatLimit(s)?'var(--red)':t>=85?'var(--orange)':t>=70?'var(--yellow)':'var(--green)';
 const w=drawWatts(s),cap=SHOP.psu[s.psu].w;
 s.el.pwrTxt.textContent=Math.round(w)+'/'+cap+' Вт';
 s.el.pwrBar.style.width=Math.min(100,w/cap*100)+'%';
 s.el.pwrBar.style.background=w>cap?'var(--red)':w>cap*0.9?'var(--yellow)':'var(--purple)';
 const c=ledColor(s);
 s.el.leds.forEach(led=>{led.style.background=c;led.style.boxShadow='0 0 8px '+c;});
 const speed=Math.max(0.25,(1-s.load/130))*(s.infected?0.4:1);
 s.el.fans.forEach(f=>f.style.animationDuration=speed.toFixed(2)+'s');
 const dl=drawWatts(s);
 let msg='';
 if(dl>cap)msg='<span class="status-err">Перегрузка БП: '+Math.round(dl)+' Вт &gt; '+cap+' Вт — риск отказа!</span>';
 else if(t>overheatLimit(s))msg='<span class="status-err">Перегрев! Кулер не справляется.</span>';
 else if(dl>cap*0.9)msg='<span class="status-warn">БП близок к пределу.</span>';
 s.el.warn.innerHTML=msg;
}

// ================= ГЛАВНЫЙ ТИК =================
let overheatLogGuard=0;
function tick(){
 let dirty=false;
 S.systems.forEach(s=>{
  // целевая нагрузка из активных задач
  s.targetLoad=Math.min(100,s.active.reduce((a,x)=>a+x.load,0));
  // плавная нагрузка + постоянные микро-колебания (никогда не стабильна)
  s.load+=(s.targetLoad-s.load)*0.08;
  s.load=Math.max(0,Math.min(100,s.load+(Math.random()-0.5)*0.8+Math.sin(Date.now()/900+s.phase)*0.25));
  // ЦЕЛЕВАЯ температура: зависит от нагрузки, мощности и охлаждения
  const target=Math.max(28,Math.min(108,30+(s.load/100)*(10+effCpuP(s)*6+effGpuP(s)*9)*coolFactor(s)));
  // плавный разгон к цели + живое «дыхание» температуры
  s.temp+=(target-s.temp)*0.07;
  s.temp+=Math.sin(Date.now()/700+s.phase)*0.18+(Math.random()-0.5)*0.35;
  s.temp=Math.max(24,Math.min(110,s.temp));
  // задачи
  const throttle=s.temp>overheatLimit(s)?0.5:1;
  s.active.forEach(at=>{at.prog+=throttle/at.dur;});
  const done=s.active.filter(at=>at.prog>=1);
  if(done.length){
   s.active=s.active.filter(at=>at.prog<1);
   done.forEach(at=>{
    S.balance+=at.reward;S.xp+=at.xp;
    clog('&#9989; '+at.n+': +'+fmt(at.reward)+' и +'+at.xp+' XP','info');
    dirty=true;
   });
   checkLevel();
  }
  // перегрев
  if(s.on&&s.temp>overheatLimit(s)){
   s.overheatTicks++;
   if(s.overheatTicks>5&&Math.random()<0.5){
    s.on=false;s.active=[];s.load=0;s.targetLoad=0;
    clog('&#128293; '+s.name+' перегрелся ('+s.temp.toFixed(1)+'\u00B0C) и выключился. Активные задачи потеряны! boot '+s.name,'err');
    s.overheatTicks=0;dirty=true;
   }
  }else s.overheatTicks=0;
  // вирусы
  if(s.on&&Math.random()<0.006){
   const br=Math.min(0.99,SHOP.av[s.av].br+0.08*up('fw'));
   if(Math.random()<br){if(Math.random()<0.15)clog('🛡 '+SHOP.av[s.av].n+' заблокировал атаку на '+s.name,'info');}
   else{s.infected=8;clog('&#9888; Вирус на '+s.name+'! Команда scan — лечение.','err');dirty=true;}
  }
  if(s.infected>0){s.infected--;S.balance=Math.max(0,S.balance-40);dirty=true;}
  // пассивный доход от сети
  const pas=SHOP.nic[s.nic].sp*8*(1+0.08*up('prem'));
  if(s.on&&pas>0){S.balance+=pas/12;dirty=true;}
  updateSystemUI(s);
 });
 // верхняя панель
 document.getElementById('balance').textContent=fmt(S.balance);
 document.getElementById('levelBadge').textContent='Ур. '+S.level;
 document.getElementById('xpText').textContent=S.xp+' / '+xpNeed(S.level)+' XP';
 document.getElementById('xpFill').style.width=(S.xp/xpNeed(S.level)*100)+'%';
 const di=document.getElementById('discountInfo');
 di.textContent=S.discount?('Скидка '+S.discount.v+'% активна!'):'';
 if(dirty){renderTasks();renderShop();renderUpgrades();}
}
function renderAll(){renderSystems();S.systems.forEach(updateSystemUI);renderTasks();renderShop();renderUpgrades();
 document.getElementById('balance').textContent=fmt(S.balance);
 document.getElementById('levelBadge').textContent='Ур. '+S.level;
 document.getElementById('xpText').textContent=S.xp+' / '+xpNeed(S.level)+' XP';
 document.getElementById('xpFill').style.width=(S.xp/xpNeed(S.level)*100)+'%';
}
// ================= СТАРТ =================
if(!loadState())S=freshState();
renderShopTabs();renderAll();
clog('Добро пожаловать! help — список команд. Промокоды: кнопка под магазином или promo КОД.','info');
setInterval(tick,1000);
setInterval(saveState,5000);
</script>
